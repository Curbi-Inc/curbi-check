name: public-checker
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Checksum-verified secret scan (including encoded content)
        shell: bash
        run: |
          mkdir -p /tmp/curbi-gitleaks
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/curbi-gitleaks/archive.tgz
          python3 -c "import hashlib; from pathlib import Path; assert hashlib.sha256(Path('/tmp/curbi-gitleaks/archive.tgz').read_bytes()).hexdigest() == '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'"
          tar -xzf /tmp/curbi-gitleaks/archive.tgz -C /tmp/curbi-gitleaks gitleaks
          /tmp/curbi-gitleaks/gitleaks dir . --config .gitleaks.toml --max-decode-depth 5 --redact
          node scripts/test-secret-scan.mjs /tmp/curbi-gitleaks/gitleaks
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/verify-export.mjs
      - run: node scripts/verify-boundary.mjs
