[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curbi-decisions"
version = "0.1.0"
description = "Deterministic policy checks for decision-model answers (TypeSafe Jev, Fastino GLiDE, OpenAI Decisions) before an agent acts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Curbi, Inc."}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://curbi.io"
Repository = "https://github.com/Curbi-Inc/curbi-check"
Documentation = "https://github.com/Curbi-Inc/curbi-check/tree/main/adapters/decisions"
Issues = "https://github.com/Curbi-Inc/curbi-check/issues"

[tool.setuptools.packages.find]
where = ["src"]
